    <button onclick="addSite()">保存站点</button>

  <div id="siteList"></div>

  <script>
    var sites = JSON.parse(localStorage.getItem('api_sites_gh_live') || '[]');

    function toggleAdd() {
      var d = document.getElementById('addDrawer');
      d.classList.toggle('active');
    }

    function saveSites() {
      localStorage.setItem('api_sites_gh_live', JSON.stringify(sites));
    }

    function addSite() {
      var name = document.getElementById('name').value.trim();
      var rawUrl = document.getElementById('url').value.trim().replace(/\/+$/, '').replace(/\/v1$/, '');
      var key = document.getElementById('key').value.replace(/[\r\n\s]/g, '');

      if (!name || !rawUrl || !key) return;

      sites.push({ id: Date.now(), name: name, url: rawUrl, key: key, balance: '-', debug: '等待刷新', status: '未查' });
      saveSites();
      render();
      toggleAdd();
      document.getElementById('name').value = '';
      document.getElementById('url').value = '';
      document.getElementById('key').value = '';
    }

    function removeSite(id) {
      sites = sites.filter(function(s) { return s.id !== id; });
      saveSites();
      render();
    }

    function findQuota(obj) {
      if (!obj || typeof obj !== 'object') return null;
      if (typeof obj.quota === 'number') return obj.quota;
      if (typeof obj.remain_quota === 'number') return obj.remain_quota;
      if (typeof obj.balance === 'number') return obj.balance * 500000;
      for (var k in obj) {
        if (typeof obj[k] === 'object') {
          var res = findQuota(obj[k]);
          if (res !== null) return res;
        }
      }
      return null;
    }

    function querySite(id) {
      var site = sites.find(function(s) { return s.id === id; });
      if (!site) return;

      site.status = '查询中';
      render();

      fetch(site.url + '/api/user/self', {
        headers: {
          'Authorization': 'Bearer ' + site.key,
          'Content-Type': 'application/json'
        }
      })
      .then(function(res) { return res.json(); })
      .then(function(json) {
        var q = findQuota(json);
        if (q !== null) {
          site.balance = '$' + (q / 500000).toFixed(2);
          var uname = (json.data && (json.data.username || json.data.display_name)) || '主账号';
          site.debug = '用户: ' + uname;
          site.status = '正常';
        } else {
          site.balance = 'Err';
          site.debug = '未解析到quota字段';
          site.status = '失败';
        }
        saveSites();
        render();
      })
      .catch(function(err) {
        site.status = '失败';
        site.debug = err.message;
        site.balance = 'Err';
        saveSites();
        render();
      });
    }

    function checkAll() {
      for (var i = 0; i < sites.length; i++) {
        querySite(sites[i].id);
      }
    }

    function render() {
      var list = document.getElementById('siteList');
      if (sites.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:#64748b;font-size:0.8rem;padding:40px 0;">暂无站点，点击右上角添加</div>';
        return;
      }
      var html = '';
      for (var i = 0; i < sites.length; i++) {
        var s = sites[i];
        var isErr = s.status === '失败' ? ' err' : '';
        html += '<div class="card">' +
          '<div class="card-top">' +
            '<span class="site-name">' + s.name + '</span>' +
            '<span class="status' + isErr + '">' + s.status + '</span>' +
          '</div>' +
          '<div class="card-metrics">' +
            '<div>' +
              '<div class="metric-label">账户总余额</div>' +
              '<div class="metric-val">' + s.balance + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="debug-info">' + s.debug + '</div>' +
          '<div class="card-actions">' +
            '<button class="btn-mini" onclick="querySite(' + s.id + ')">刷新</button>' +
            '<button class="del" onclick="removeSite(' + s.id + ')">✕</button>' +
          '</div>' +
        '</div>';
      }
      list.innerHTML = html;
    }

    render();
  </script>
</body>
</html>
